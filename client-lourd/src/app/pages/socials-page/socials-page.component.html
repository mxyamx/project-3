<div class="socials-container">
    <!-- Friends Section -->
    <div class="friends-section">
        <h2><i class="fa fa-users"></i> Mes amis</h2>
        <ul>
            <li *ngFor="let friend of friends">
                <div class="user-info">
                    <img class="avatar" src="https://via.placeholder.com/40" alt="Avatar" />
                    <span>{{ friend.username }}</span>
                </div>
                <div class="actions">
                    <button class="remove-btn" (click)="removeFriend(friend.id)">Supprimer</button>
                    <button class="block-btn" (click)="blockUser(friend.id)">Bloquer</button>
                </div>
            </li>
        </ul>
    </div>

    <!-- Blocked Section -->
    <div class="blocked-section">
        <h2><i class="fa fa-ban"></i> Utilisateurs bloqués</h2>
        <ul>
            <li *ngFor="let blocked of blockedUsers">
                <div class="user-info">
                    <img class="avatar" src="https://via.placeholder.com/40" alt="Avatar" />
                    <span>{{ blocked.username }}</span>
                </div>
                <div class="actions">
                    <button class="unblock-btn" (click)="unblockUser(blocked.id)">Débloquer</button>
                </div>
            </li>
        </ul>
    </div>
</div>
