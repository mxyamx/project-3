<div class="shop-page">
    <div class="toolbar">
        <button class="btn" (click)="goBack()"><i class="fas fa-arrow-left"></i> Retour</button>
        <div class="balance">
            <i class="fa-solid fa-coins"></i><span>{{ money() }}</span>
        </div>
    </div>

    <div class="section">
        <h2>Avatars exclusifs</h2>
        <div class="grid">
            <div class="card" *ngFor="let item of catalog">
                <img [src]="item.asset" [alt]="item.name" />
                <div class="info">
                    <div class="name">{{ item.name }}</div>
                    <div class="price"><i class="fa-solid fa-coins"></i> {{ item.price }}</div>
                </div>
                <div class="actions" *ngIf="!isOwned(item); else ownedTpl">
                    <button class="btn primary" [disabled]="!canAfford(item) || buying() === item.id" (click)="buy(item)">
                        {{ buying() === item.id ? 'Achat…' : canAfford(item) ? 'Acheter' : 'Solde insuffisant' }}
                    </button>
                </div>
                <ng-template #ownedTpl>
                    <div class="owned">Possédé</div>
                </ng-template>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Effets sonores exclusifs</h2>
        <div class="grid">
            <div class="card" *ngFor="let s of sfxCatalog">
                <div class="info">
                    <div class="name">{{ s.name }}</div>
                    <div class="price"><i class="fa-solid fa-coins"></i> {{ s.price }}</div>
                </div>
                <div class="actions">
                    <button class="btn play" (click)="playPreview(s)"><i class="fa-solid fa-play"></i> Pré-écouter</button>
                </div>
                <div class="actions">
                    <button class="btn primary" [disabled]="isOwnedSfx(s) || !canAffordSfx(s) || buying() === s.id" (click)="buySfx(s)">
                        <ng-container *ngIf="!isOwnedSfx(s); else sOwned">Acheter</ng-container>
                    </button>
                    <ng-template #sOwned><div class="owned-sfx">Possédé</div></ng-template>
                </div>
            </div>
        </div>
    </div>

    <p class="error" *ngIf="errorMsg()">{{ errorMsg() }}</p>
</div>
