<div class="container">
    <h2>Choisis ton avatar</h2>
    <div class="images">
        @for (image of images; track image) {
        <img
            [src]="image"
            [class.selected]="image === selectedImage"
            [class.unselectable]="isDisabled(image)"
            (click)="!isDisabled(image) && onImageButtonClick(image)"
            alt="Avatar"
            formControlName="avatar"
        />
        }
    </div>
</div>
