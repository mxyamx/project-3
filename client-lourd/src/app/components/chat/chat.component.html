<div class="chat-container">
    @if(isExpended()){
    <div class="chat-header">
        <h3>
            Clavardage -
            <span>{{ playerName }}</span>
        </h3>
        @if(!isPopup){
        <button class="open-btn" (click)="openChatPopup()"><img src="assets/icones/open_in_new.svg" alt="Open in new icon" /></button>
        }
    </div>
    <div class="chat-messages" #scroll>
        <div class="message-list">
            @for (message of chatService.roomMessages; track message.timestamp) {
            <div class="message" [ngClass]="{ 'my-message': message.sender === playerName }">
                <div class="message-header">
                    <span class="sender">{{ message.sender }}</span>
                    <span class="timestamp">{{ message.timestamp | date: 'HH:mm:ss' }}</span>
                </div>
                <div class="message-content">
                    {{ message.text }}
                </div>
            </div>
            }
        </div>
    </div>
    }

    <div class="chat-input">
        <input
            id="roomMessage"
            [(ngModel)]="messageInput"
            (keydown.enter)="sendToRoom()"
            (focus)="onInputFocus()"
            (blur)="onInputBlur()"
            type="text"
            required
            minlength="1"
            maxlength="200"
        />
        <button (click)="sendToRoom()">Envoyer</button>
    </div>
</div>
