@if(this.showChannelNavigator()){
<app-channel-navigator
    class="channel-container"
    (openPopup)="openPopup($event)"
    (openChat)="openChat($event)"
    [isPopup]="isPopup"
    [gameChannel]="gameChannel"
></app-channel-navigator>
} @else {
<app-chat
    class="channel-container"
    [roomId]="channelId"
    [isPopup]="isPopup"
    (closeChat)="closeChat()"
    [chatName]="channelName"
    (openPopup)="openPopup($event)"
></app-chat>
}
