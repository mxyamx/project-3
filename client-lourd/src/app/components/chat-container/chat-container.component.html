@if(this.showChannelNavigator()){
<app-channel-navigator
    (openChat)="openChat($event)"
    [isPopup]="isPopup"
    [gameChannel]="gameChannel"
    [isExpended]="isExpended"
></app-channel-navigator>
} @else {
<app-chat [roomId]="channelId" [isPopup]="isPopup" (closeChat)="closeChat()" [isExpended]="isExpended" [chatName]="channelName"></app-chat>
}
